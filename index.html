<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Portfolio</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .card {
      background: #1e293b;
      padding: 32px;
      border-radius: 12px;
      max-width: 480px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
    }
    h1 { margin-top: 0; color: #38bdf8; }
    .tag {
      display: inline-block;
      background: #334155;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 12px;
      margin-right: 6px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Hi, I'm a Student Builder</h1>
    <p>Building practical web &amp; software projects while learning fast.</p>
    <div>
      <span class="tag">HTML / CSS</span>
      <span class="tag">Problem Solving</span>
      <span class="tag">GitHub</span>
    </div>
  </div>
</body>
</html>
